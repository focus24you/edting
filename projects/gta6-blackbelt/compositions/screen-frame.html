<!doctype html>
<!-- edit skill scene template: screen-frame. Colors/fonts: ../brand/brand.css. Do not hard-code either here. -->
<html lang="de" data-composition-variables='[{"id": "label", "type": "string", "label": "Text in der Fensterleiste", "default": "claude.ai"}, {"id": "title", "type": "string", "label": "optional: Überschrift über dem Fenster", "default": ""}, {"id": "duration", "type": "number", "label": "Länge in Sekunden (= data-duration am Host)", "default": 4}]'>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../brand/brand.css" />
    <link rel="stylesheet" href="../brand/edit.css" />
    <script src="../brand/gsap.min.js"></script>
    <script src="../brand/edit.js"></script>
    <style>
      /* Sits ABOVE the host <video class="edit-screen">: the hole shows the video, the huge shadow paints the background. */
      .hole { position: absolute; left: var(--sf-l); top: var(--sf-t); width: var(--sf-w); height: var(--sf-h); border-radius: 0 0 calc(var(--u) * 18) calc(var(--u) * 18); box-shadow: 0 0 0 200vmax var(--bg); }
      .edge { position: absolute; left: var(--sf-l); top: calc(var(--sf-t) - var(--u) * 58); width: var(--sf-w); height: calc(var(--sf-h) + var(--u) * 58); border-radius: calc(var(--u) * 18); border: calc(var(--u) * 2) solid var(--line); }
      .barwin { position: absolute; left: var(--sf-l); top: calc(var(--sf-t) - var(--u) * 58); width: var(--sf-w); height: calc(var(--u) * 58); background: var(--surface); border-radius: calc(var(--u) * 18) calc(var(--u) * 18) 0 0; display: flex; align-items: center; gap: calc(var(--u) * 12); padding: 0 calc(var(--u) * 24); }
      .barwin i { width: calc(var(--u) * 16); height: calc(var(--u) * 16); border-radius: 50%; background: var(--line); }
      .barwin i:first-child { background: var(--accent); }
      .lab { margin-left: calc(var(--u) * 16); font-weight: 500; font-size: calc(var(--u) * 28); color: var(--muted); }
      .title { position: absolute; left: var(--sf-l); right: var(--sf-l); bottom: calc(100vh - var(--sf-t) + var(--u) * 96); font-size: calc(var(--u) * 110); display: none; }
      @media (orientation: portrait) { .title { display: block; } }
    </style>
  </head>
  <body>
    <!-- data-duration is a ceiling; the host element's data-duration decides the real length -->
    <div id="root" data-composition-id="screen-frame" data-width="1080" data-height="1920" data-start="0" data-duration="3600">
      <div class="scene">
      <div class="hole"></div>
      <div class="edge"></div>
      <div class="barwin"><i></i><i></i><i></i><span class="lab"></span></div>
      <div class="display title"></div>
      </div>
    </div>
    <script>
      // HyperFrames scopes document / gsap / __hyperframes per instance in THIS inline script only,
      // so variables, the scene node and the timeline are fetched here and handed to the shared helper.
      (function () {
        var tl = gsap.timeline({ paused: true });
        EDIT.scene(window.__hyperframes.getVariables(), document.querySelector(".scene"), tl, function (v, tl, dur, q, root) {
        q(".lab").textContent = v.label || "";
        var w = EDIT.words(q(".title"), v.title || "");
        tl.fromTo(q(".lab"), { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.15);
        EDIT.rise(tl, w, 0.15, 0.06);
        });
        window.__timelines["screen-frame"] = tl;
      })();
    </script>
  </body>
</html>
