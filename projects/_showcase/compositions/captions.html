<!doctype html>
<!-- edit skill scene template: captions. Colors/fonts: ../brand/brand.css. Do not hard-code either here. -->
<html lang="de" data-composition-variables='[{"id": "position", "type": "string", "label": "bottom oder center", "default": "bottom"}, {"id": "offset", "type": "number", "label": "Sekunden, um alle Captions zu verschieben", "default": 0}]'>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../brand/brand.css" />
    <link rel="stylesheet" href="../brand/edit.css" />
    <script src="../brand/gsap.min.js"></script>
    <script src="../brand/edit.js"></script>
    <script src="../captions-data.js"></script>
    <style>
      .g { position: absolute; left: var(--pad-x); right: var(--pad-x); bottom: calc(var(--u) * 120); text-align: center; font-size: calc(var(--u) * 104); line-height: 0.98; visibility: hidden; }
      .center .g { bottom: auto; top: 50%; margin-top: calc(var(--u) * -52); }
      .cw { display: inline-block; margin: 0 0.11em; color: var(--text); -webkit-text-stroke: calc(var(--u) * 12) var(--bg); paint-order: stroke fill; text-shadow: 0 calc(var(--u) * 6) calc(var(--u) * 24) rgba(0, 0, 0, 0.5); }
      @media (orientation: portrait) { .g { bottom: calc(var(--u) * 560); font-size: calc(var(--u) * 112); } }
    </style>
  </head>
  <body>
    <!-- data-duration is a ceiling; the host element's data-duration decides the real length -->
    <div id="root" data-composition-id="captions" data-width="1920" data-height="1080" data-start="0" data-duration="3600">
      <div class="scene">
      <div class="stage"></div>
      </div>
    </div>
    <script>
      // HyperFrames scopes document / gsap / __hyperframes per instance in THIS inline script only,
      // so variables, the scene node and the timeline are fetched here and handed to the shared helper.
      (function () {
        var tl = gsap.timeline({ paused: true });
        EDIT.scene(window.__hyperframes.getVariables(), document.querySelector(".scene"), tl, function (v, tl, dur, q, root) {
        if (v.position === "center") root.classList.add("center");
        var data = window.EDIT_CAPTIONS || { groups: [] }, off = Number(v.offset) || 0, stage = q(".stage");
        var cs = getComputedStyle(root);
        var accent = cs.getPropertyValue("--accent").trim(), text = cs.getPropertyValue("--text").trim();
        data.groups.forEach(function (g) {
          var el = document.createElement("div");
          el.className = "display g";
          el.innerHTML = g.words.map(function (w) { return '<span class="cw">' + EDIT.esc(w.t) + "</span>"; }).join("");
          stage.appendChild(el);
          var s = Math.max(0, g.start + off);
          tl.set(el, { visibility: "visible" }, s);
          tl.fromTo(el, { scale: 0.92 }, { scale: 1, duration: 0.14, ease: "back.out(2)" }, s);
          el.querySelectorAll(".cw").forEach(function (n, i) {
            var w = g.words[i], ws = Math.max(s, w.start + off);
            tl.set(n, { color: accent }, ws);
            if (i < g.words.length - 1) tl.set(n, { color: text }, Math.max(ws + 0.01, g.words[i + 1].start + off));
          });
          tl.set(el, { visibility: "hidden" }, Math.max(s + 0.05, g.end + off));
        });
        });
        window.__timelines["captions"] = tl;
      })();
    </script>
  </body>
</html>
