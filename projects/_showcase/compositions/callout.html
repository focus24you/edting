<!doctype html>
<!-- edit skill scene template: callout. Colors/fonts: ../brand/brand.css. Do not hard-code either here. -->
<html lang="de" data-composition-variables='[{"id": "text", "type": "string", "label": "Stichwort", "default": "Hier klicken"}, {"id": "x", "type": "number", "label": "Zielpunkt X in % der Breite", "default": 50}, {"id": "y", "type": "number", "label": "Zielpunkt Y in % der Höhe", "default": 50}, {"id": "side", "type": "string", "label": "Label rechts (right) oder links (left) vom Punkt", "default": "right"}, {"id": "duration", "type": "number", "label": "Länge in Sekunden (= data-duration am Host)", "default": 3}]'>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../brand/brand.css" />
    <link rel="stylesheet" href="../brand/edit.css" />
    <script src="../brand/gsap.min.js"></script>
    <script src="../brand/edit.js"></script>
    <style>
      .anchor { position: absolute; width: 0; height: 0; }
      .dot { position: absolute; left: calc(var(--u) * -14); top: calc(var(--u) * -14); width: calc(var(--u) * 28); height: calc(var(--u) * 28); border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 calc(var(--u) * 6) rgba(11, 11, 15, 0.7); }
      .ring { position: absolute; left: calc(var(--u) * -34); top: calc(var(--u) * -34); width: calc(var(--u) * 68); height: calc(var(--u) * 68); border-radius: 50%; border: calc(var(--u) * 4) solid var(--accent); }
      .line { position: absolute; left: calc(var(--u) * 14); top: calc(var(--u) * -3); width: calc(var(--u) * 130); height: calc(var(--u) * 6); background: var(--accent); transform-origin: 0 50%; }
      .pill { position: absolute; left: calc(var(--u) * 144); top: 0; transform: translateY(-50%); background: var(--accent); color: var(--accent-ink); font-size: calc(var(--u) * 68); padding: calc(var(--u) * 14) calc(var(--u) * 26) calc(var(--u) * 6); white-space: nowrap; line-height: 1; }
      .left .line { left: auto; right: calc(var(--u) * 14); transform-origin: 100% 50%; }
      .left .pill { left: auto; right: calc(var(--u) * 144); }
    </style>
  </head>
  <body>
    <!-- data-duration is a ceiling; the host element's data-duration decides the real length -->
    <div id="root" data-composition-id="callout" data-width="1920" data-height="1080" data-start="0" data-duration="3600">
      <div class="scene">
      <div class="anchor">
        <div class="ring"></div><div class="dot"></div><div class="line"></div>
        <div class="display pill"></div>
      </div>
      </div>
    </div>
    <script>
      // HyperFrames scopes document / gsap / __hyperframes per instance in THIS inline script only,
      // so variables, the scene node and the timeline are fetched here and handed to the shared helper.
      (function () {
        var tl = gsap.timeline({ paused: true });
        EDIT.scene(window.__hyperframes.getVariables(), document.querySelector(".scene"), tl, function (v, tl, dur, q, root) {
        var a = q(".anchor"), left = v.side === "left";
        a.style.left = Number(v.x) + "%"; a.style.top = Number(v.y) + "%";
        if (left) a.classList.add("left");
        q(".pill").textContent = v.text;
        var hide = left ? "inset(0 0 0 100%)" : "inset(0 100% 0 0)";
        tl.fromTo(q(".dot"), { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2.5)" }, 0.05);
        tl.fromTo(q(".ring"), { scale: 0.4, opacity: 1 }, { scale: 1.5, opacity: 0, duration: 0.7, ease: "power2.out" }, 0.1);
        tl.fromTo(q(".line"), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: EDIT.EASE }, 0.2);
        tl.fromTo(q(".pill"), { clipPath: hide }, { clipPath: "inset(0 0% 0 0%)", duration: 0.4, ease: EDIT.EASE }, 0.38);
        EDIT.out(tl, a, dur, 0.2);
        });
        window.__timelines["callout"] = tl;
      })();
    </script>
  </body>
</html>
