<!doctype html>
<!-- edit skill scene template: lower-third. Colors/fonts: ../brand/brand.css. Do not hard-code either here. -->
<html lang="de" data-composition-variables='[{"id": "name", "type": "string", "label": "Name", "default": "Felix Beispiel"}, {"id": "role", "type": "string", "label": "Rolle / Zusatz", "default": "Gründer · FlowLine"}, {"id": "side", "type": "string", "label": "left oder right", "default": "left"}, {"id": "duration", "type": "number", "label": "Länge in Sekunden (= data-duration am Host)", "default": 5}]'>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../brand/brand.css" />
    <link rel="stylesheet" href="../brand/edit.css" />
    <script src="../brand/gsap.min.js"></script>
    <script src="../brand/edit.js"></script>
    <style>
      .lt { position: absolute; left: var(--pad-x); bottom: var(--pad-y); display: flex; align-items: stretch; }
      .lt.right { left: auto; right: var(--pad-x); flex-direction: row-reverse; }
      .bar { width: calc(var(--u) * 12); background: var(--accent); transform-origin: 50% 100%; flex: none; }
      .plate { background: var(--bg); padding: calc(var(--u) * 20) calc(var(--u) * 34) calc(var(--u) * 20) calc(var(--u) * 28); }
      .name { font-size: calc(var(--u) * 88); white-space: nowrap; overflow: hidden; padding-top: 0.05em; }
      .name span { display: inline-block; }
      .role { font-weight: 500; font-size: calc(var(--u) * 30); color: var(--muted); letter-spacing: 0.02em; white-space: nowrap; margin-top: calc(var(--u) * 6); }
      @media (orientation: portrait) { .lt { bottom: calc(var(--u) * 730); } }
    </style>
  </head>
  <body>
    <!-- data-duration is a ceiling; the host element's data-duration decides the real length -->
    <div id="root" data-composition-id="lower-third" data-width="1920" data-height="1080" data-start="0" data-duration="3600">
      <div class="scene">
      <div class="lt">
        <div class="bar"></div>
        <div class="plate"><div class="display name"><span></span></div><div class="role"></div></div>
      </div>
      </div>
    </div>
    <script>
      // HyperFrames scopes document / gsap / __hyperframes per instance in THIS inline script only,
      // so variables, the scene node and the timeline are fetched here and handed to the shared helper.
      (function () {
        var tl = gsap.timeline({ paused: true });
        EDIT.scene(window.__hyperframes.getVariables(), document.querySelector(".scene"), tl, function (v, tl, dur, q, root) {
        var right = v.side === "right";
        if (right) q(".lt").classList.add("right");
        q(".name span").textContent = v.name;
        q(".role").textContent = v.role || "";
        if (!v.role) q(".role").style.display = "none";
        var hide = right ? "inset(0 0 0 100%)" : "inset(0 100% 0 0)";
        tl.fromTo(q(".bar"), { scaleY: 0 }, { scaleY: 1, duration: 0.35, ease: EDIT.EASE }, 0.05);
        tl.fromTo(q(".plate"), { clipPath: hide }, { clipPath: "inset(0 0% 0 0%)", duration: 0.55, ease: EDIT.EASE }, 0.2);
        tl.fromTo(q(".name span"), { yPercent: 110 }, { yPercent: 0, duration: 0.55, ease: EDIT.EASE }, 0.3);
        tl.fromTo(q(".role"), { opacity: 0 }, { opacity: 1, duration: 0.35 }, 0.5);
        tl.to(q(".plate"), { clipPath: hide, duration: 0.35, ease: "power3.in" }, dur - 0.55);
        tl.to(q(".bar"), { scaleY: 0, duration: 0.2, ease: "power2.in" }, dur - 0.25);
        });
        window.__timelines["lower-third"] = tl;
      })();
    </script>
  </body>
</html>
